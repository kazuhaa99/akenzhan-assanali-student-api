name: akenzhan-assanali-student-api

services:
  postgres:
    image: postgres:16-alpine
    container_name: akenzhan-assanali-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - akenzhan_assanali_pgdata:/var/lib/postgresql/data
    networks:
      - akenzhan-assanali-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_TAG:-v1.0-akenzhan-assanali}
    image: akenzhan-assanali-student-api:${APP_TAG:-v1.0-akenzhan-assanali}
    container_name: akenzhan-assanali-student-api
    environment:
      # "postgres" is the Compose service name, resolved by Docker's internal DNS
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - akenzhan-assanali-net

volumes:
  akenzhan_assanali_pgdata:

networks:
  akenzhan-assanali-net:
    driver: bridge
