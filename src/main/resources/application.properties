spring.application.name=akenzhan-assanali-student-api
server.port=8080

app.student-name=Akenzhan Assanali
app.version=${APP_VERSION:v1.0-akenzhan-assanali}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/akenzhan_students}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:akenzhan}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
