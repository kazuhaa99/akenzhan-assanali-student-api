jenkins:
  systemMessage: "Jenkins CI for Akenzhan Assanali — Student API"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "akenzhan"
          name: "Akenzhan Assanali"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "akenzhan-assanali-db-password"
              description: "PostgreSQL password for the Student API (Akenzhan Assanali)"
              secret: "${POSTGRES_PASSWORD}"

tool:
  jdk:
    installations:
      - name: "jdk-17"
        home: "/opt/java/openjdk"

jobs:
  - script: >
      pipelineJob('Akenzhan_Assanali_Student_API') {
        description('CI pipeline for the Spring Boot Student API of Akenzhan Assanali')
        parameters {
          stringParam('BRANCH', 'main', 'Git branch to build')
        }
        properties {
          pipelineTriggers {
            triggers {
              pollSCM { scmpoll_spec('H/2 * * * *') }
            }
          }
        }
        definition {
          cpsScm {
            scm {
              git {
                remote { url('https://github.com/kazuhaa99/akenzhan-assanali-student-api.git') }
                branch('*/${BRANCH}')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(false)
          }
        }
      }
